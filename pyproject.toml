[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deepkernels-playground"
version = "1.0.0"
description = "deepkernels -- A generative kernel machine for scalable simulation-based inference (public-access-version)"
requires-python = ">=3.10"
dependencies = [
    # Core Deep Learning & Gaussian Processes (torch/gpytorch/linear-operator)
    "torch==2.5.1",
    "gpytorch==1.11",
    "linear-operator==0.5.0", 
    "numpy==2.2.6"
]

[project.optional-dependencies]
dev = [
    "jupyterlab>=4.2.0",
    "black==24.1.1",
    "isort==5.13.2",
    "safety==3.0.1"
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["deepkernels*"]