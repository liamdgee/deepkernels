
x-deepkernels-base: &base
  build:
    context: .
    dockerfile: Dockerfile.public
  volumes:
    - .:/app 
  shm_size: '2gb'

services:
  demo:
    <<: *base
    container_name: deepkernels-demo
    profiles:
      - demo
  
  playground:
    <<: *base
    container_name: deepkernels-playground
    profiles:
      - playground
    ports:
      - "8888:8888"
    environment:
      - JUPYTER_ENABLE_LAB=yes
    command: ["jupyter", "lab", "--ip=0.0.0.0", "--port=8888", "--no-browser", "--allow-root", "--NotebookApp.token=''"]